; ESP-NOW bench for wsdr-studio (see README.md). Envs as in snokvist/esp32-supermini-projects.
[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:esp32c3_supermini]
extends = common
board = esp32-c3-devkitm-1

[env:tdisplays3]
extends = common
board = lilygo-t-display-s3
